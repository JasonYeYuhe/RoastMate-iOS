name: RoastMate
options:
  bundleIdPrefix: yyh.roastmate
  deploymentTarget:
    # v1.2.0: lowered from 26.0 so the app installs on devices WITHOUT Apple
    # Foundation Models (FM is optional — on-device when present, consent-gated
    # cloud otherwise). watchOS stays 26.0 (no viable on-device/cloud path on
    # Watch this cycle; FoundationModels isn't in the watchOS SDK anyway).
    iOS: "18.0"
    macOS: "14.0"
    watchOS: "26.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true
  developmentLanguage: en
  knownRegions: [en, zh-Hans, zh-Hant, ja]

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: 15
    DEVELOPMENT_TEAM: KHMK6Q3L3K
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES

targets:
  RoastMate:
    type: application
    platform: iOS
    sources:
      - RoastMate/Sources
      - RoastMate/Assets.xcassets
      - RoastMate/PrivacyInfo.xcprivacy
      - path: RoastMate/Configuration.storekit
        buildPhase: none
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: yyh.roastmate.app
        PRODUCT_NAME: RoastMate
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: RoastMate
        INFOPLIST_KEY_NSUserActivityTypes: yyh.roastmate.app.handoff.session
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "The mic is used only to transcribe your spoken vent on-device. Your voice audio is never recorded, saved, or sent anywhere."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Speech recognition runs on-device to turn your spoken vent into editable text. Your voice audio never leaves your phone."
        INFOPLIST_FILE: RoastMate/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: RoastMate/RoastMate.entitlements
        # Defense-in-depth weak-link: FoundationModels is iOS-26-only and every
        # symbol sits behind `@available` in AppleFMBackend, so Swift already
        # auto-weak-links it. The explicit flag guarantees the binary loads
        # clean on iOS 18 (dyld tolerates an absent weak dylib). NOT applied to
        # the watch target — FoundationModels isn't in the watchOS SDK.
        OTHER_LDFLAGS: "$(inherited) -weak_framework FoundationModels"
      configs:
        debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    dependencies:
      - target: RoastMateShare
        embed: true
      - target: RoastMateControls
        embed: true
      # RoastMateKeyboard removed 2026-05-29 (health audit §2 — structural
      # KILL): the ~50MB keyboard-extension memory ceiling makes on-device
      # inference unviable, and the skeleton had been dormant + un-embedded
      # since v1.1. Revive from git history only with a fundamentally
      # different (server-side or tiny-model) approach.
    scheme:
      testTargets:
        - RoastMateTests
        - RoastMateUITests
      gatherCoverageData: false
      storeKitConfiguration: RoastMate/Configuration.storekit

  RoastMateMac:
    type: application
    platform: macOS
    sources:
      - RoastMate/Sources
      - RoastMateMac/Sources
      - RoastMateMac/Assets.xcassets
      - RoastMate/PrivacyInfo.xcprivacy
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: yyh.roastmate.app
        PRODUCT_NAME: RoastMate
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.lifestyle"
        INFOPLIST_KEY_LSUIElement: NO
        INFOPLIST_KEY_CFBundleDisplayName: RoastMate
        INFOPLIST_KEY_NSUserActivityTypes: yyh.roastmate.app.handoff.session
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: RoastMateMac/RoastMateMac.entitlements
        OTHER_LDFLAGS: "$(inherited) -weak_framework FoundationModels"  # see RoastMate note
      configs:
        debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    scheme:
      gatherCoverageData: false

  RoastMateWatch:
    type: application
    platform: watchOS
    sources:
      - RoastMateWatch/Sources
      - RoastMateWatch/Assets.xcassets
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: yyh.roastmate.app.watchkitapp
        PRODUCT_NAME: RoastMate
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: yyh.roastmate.app
        INFOPLIST_KEY_CFBundleDisplayName: RoastMate
        INFOPLIST_KEY_NSUserActivityTypes: yyh.roastmate.app.handoff.session
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: RoastMateWatch/RoastMateWatch.entitlements
        WATCHOS_DEPLOYMENT_TARGET: "26.0"
      configs:
        debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    scheme:
      gatherCoverageData: false

  RoastMateShare:
    type: app-extension
    platform: iOS
    sources:
      - RoastMateShare/Sources
      - path: RoastMateShare/Info.plist
        buildPhase: none
      - Shared
      - path: Shared/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: yyh.roastmate.app.share
        PRODUCT_NAME: RoastMateShare
        INFOPLIST_FILE: RoastMateShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: RoastMateShare/RoastMateShare.entitlements
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APP_EXTENSION"
        OTHER_LDFLAGS: "$(inherited) -weak_framework FoundationModels"  # see RoastMate note
      configs:
        debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"

  RoastMateControls:
    type: app-extension
    platform: iOS
    sources:
      - RoastMateControls/Sources
      - path: RoastMateControls/Info.plist
        buildPhase: none
      - Shared
      - path: Shared/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: yyh.roastmate.app.controls
        PRODUCT_NAME: RoastMateControls
        INFOPLIST_FILE: RoastMateControls/Info.plist
        CODE_SIGN_ENTITLEMENTS: RoastMateControls/RoastMateControls.entitlements
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APP_EXTENSION"
        OTHER_LDFLAGS: "$(inherited) -weak_framework FoundationModels"  # see RoastMate note
      configs:
        debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"

  RoastMateTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - RoastMateTests
      - Shared
      - path: Shared/Resources
        buildPhase: resources
    # Hostless bundle (TEST_HOST/BUNDLE_LOADER empty): logic under test
    # lives in Shared (compiled in directly) and app-target types are
    # reached via `@testable import RoastMate`. `link: false` makes the
    # app a build-ORDER dependency only — it guarantees RoastMate's
    # testing-enabled .swiftmodule exists before these tests compile
    # (cold/parallel builds otherwise race, surfacing as "unable to
    # resolve module dependency: 'RoastMate'") WITHOUT linking the app
    # binary, which would double-link Shared.
    dependencies:
      - target: RoastMate
        link: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: yyh.roastmate.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ""
        BUNDLE_LOADER: ""
        OTHER_LDFLAGS: "$(inherited) -weak_framework FoundationModels"  # see RoastMate note

  RoastMateUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - RoastMateUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: yyh.roastmate.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: RoastMate
    dependencies:
      - target: RoastMate
