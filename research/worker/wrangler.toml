# Cloudflare Worker config — RoastMate research recruit endpoint.
# Deploy: `npx wrangler deploy` from this directory.
# Requires a Cloudflare account + `npx wrangler login` first.

name = "roastmate-research"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Two KV namespaces (created via `npx wrangler kv namespace create RESEARCH_ANSWERS`
# and `... create RESEARCH_CONTACTS`). Replace the placeholder IDs below with
# the IDs printed by wrangler at create time.
#
# Codex catch on v1 research protocol: answers and contact email MUST live
# in separate tables so an analyst working with answers never has email
# access in the same query surface.
[[kv_namespaces]]
binding = "RESEARCH_ANSWERS"
id = "149e6fc75bbf4608a652290ff69d6ec6"

[[kv_namespaces]]
binding = "RESEARCH_CONTACTS"
id = "2154ffa8f18f465abe92ff1b6c302da6"

# CORS allow-list — comma-separated origins that can POST. The Worker
# splits on `,` and matches exactly. Add the custom-domain origin once
# roastmate.app is mapped to GH Pages; the Worker accepts both.
[vars]
ALLOWED_ORIGIN = "https://jasonyeyuhe.github.io,https://roastmate.app"
