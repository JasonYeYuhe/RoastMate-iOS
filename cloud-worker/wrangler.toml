name = "roastmate-vent"
main = "src/index.js"
compatibility_date = "2025-01-01"
# nodejs_compat: needed by the /v1/auth Apple-JWS verifier (Buffer + node:crypto
# via @apple/app-store-server-library). Additive — the existing vent/roommate
# paths use only Web APIs and are unaffected. (Track M M.1, v1.3.)
compatibility_flags = ["nodejs_compat"]

# OpenRouter FALLBACK model (Groq is primary; see below). Must be a
# CURRENT, stable model with its OWN quota — NOT a `:free` variant (the
# shared :free pool 402s/404s when the provider retires the tier, which is
# exactly what took the cloud path down on 2026-08-31: the old
# `hermes-3-llama-3.1-405b:free` had been retired → 404). MUST ALSO be a
# NON-REASONING (instruct) model: the previous GLM-5.3-flash was a hybrid
# reasoning model that "thought" for 17-31s on these prompts, so whenever Groq
# missed the fallback stalled. qwen3-30b-a3b-INSTRUCT-2507 is the non-thinking
# Qwen (same family as the Groq primary → the Qwen-tuned prompt transfers, strong
# zh vent, no <think>). Alternates: deepseek/deepseek-chat, meta-llama/llama-3.3-
# 70b-instruct (Llama over-moralizes zh — test first). Never a *-thinking model.
[vars]
DEFAULT_MODEL = "qwen/qwen3-30b-a3b-instruct-2507"

# Groq is PRIMARY (lower latency, isolated quota). Routed by locale. Verified
# against the live Groq catalog 2026-08-31: the old primaries both died —
# `qwen/qwen3-32b` was DEPRECATED and `llama-3.3-70b-versatile` became
# Enterprise-only ("Contact Sales"), so a standard key 404s both. Moved to
# qwen/qwen3.6-27b: current, non-Enterprise, defined dev limits (250K TPM /
# 1K RPM), Chinese-strong, low enough politeness-RLHF to actually vent (the
# GPT-OSS alternatives would neuter it; no Llama is on the dev plan). Same
# model both locales for now. qwen3.8-27b is the newer Preview option (undefined
# limits) once validated. Smoke-verified through the live Worker after deploy;
# any Groq 404 still falls through to the OpenRouter fallback above.
GROQ_CHINESE_MODEL = "qwen/qwen3.6-27b"
GROQ_FALLBACK_MODEL = "qwen/qwen3.6-27b"

# Track M edge breakers (v1.3). Both default OFF (behavior unchanged).
# CLOUD_DISABLED="true" → 503 on every /v1/vent (global kill-switch).
# ROAST_MODE_ENABLED gates the sendable mode:"roast" cloud path; stays
# "false" until the Track M dam + zh-Hans sendable eval clear it.
CLOUD_DISABLED = "false"
ROAST_MODE_ENABLED = "false"

# Per-device rate limit (LEGACY / free lane — no session token). Counted against
# (deviceId, YYYY-MM-DD) in KV. Tune as cost / abuse picture evolves. M.2 will
# tighten this for pure-cloud free users.
DAILY_LIMIT_PER_DEVICE = "30"

# PRO lane daily cap (Track M M.1 v2): requests with a valid /v1/auth session
# token are counted against (account-sub, YYYY-MM-DD), so one Pro subscription
# shares one bucket across the user's devices.
PRO_DAILY_LIMIT = "200"

# Stricter PER-IP daily cap applied ONLY to the public web demo (requests
# with an Origin from jasonyeyuhe.github.io). The native app carries no
# browser Origin and is unaffected. Bounds token cost if the demo is scraped.
WEB_DAILY_LIMIT_PER_IP = "8"

# OpenRouter referrer + product name so OpenRouter's dashboard shows
# attribution. Not secret; safe in vars.
OPENROUTER_REFERER = "https://github.com/JasonYeYuhe/RoastMate-iOS"
OPENROUTER_TITLE = "RoastMate"

# KV namespace for per-device rate-limit counters. Replace the `id` after
# `npx wrangler kv:namespace create rate_limits` (see README).
[[kv_namespaces]]
binding = "RATE_LIMITS"
id = "9883573e953e4a01a3bb22f86016438a"

# Secrets (run `npx wrangler secret put <NAME>`):
# - OPENROUTER_API_KEY: from https://openrouter.ai/settings/keys (required)
# - GROQ_API_KEY: from https://console.groq.com/keys (optional fallback)
