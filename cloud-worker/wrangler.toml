name = "roastmate-vent"
main = "src/index.js"
compatibility_date = "2025-01-01"
# nodejs_compat: needed by the /v1/auth Apple-JWS verifier (Buffer + node:crypto
# via @apple/app-store-server-library). Additive — the existing vent/roommate
# paths use only Web APIs and are unaffected. (Track M M.1, v1.3.)
compatibility_flags = ["nodejs_compat"]

# OpenRouter FALLBACK model (Groq is primary; see below). Must be a
# CURRENT, stable model with its OWN quota — NOT a `:free` variant (the
# shared :free pool 402s/404s when the provider retires the tier, which is
# exactly what took the cloud path down on 2026-08-31: the old
# `hermes-3-llama-3.1-405b:free` had been retired → 404). MUST ALSO be a
# NON-REASONING (instruct) model: the previous GLM-5.3-flash was a hybrid
# reasoning model that "thought" for 17-31s on these prompts, so whenever Groq
# missed the fallback stalled. qwen3-30b-a3b-INSTRUCT-2507 is the non-thinking
# Qwen (same family as the Groq primary → the Qwen-tuned prompt transfers, strong
# zh vent, no <think>). Alternates: deepseek/deepseek-chat, meta-llama/llama-3.3-
# 70b-instruct (Llama over-moralizes zh — test first). Never a *-thinking model.
[vars]
DEFAULT_MODEL = "qwen/qwen3-30b-a3b-instruct-2507"

# Groq is PRIMARY (lower latency, isolated quota). Routed by locale. Verified
# against the live Groq catalog 2026-08-31: the old primaries both died —
# `qwen/qwen3-32b` was DEPRECATED and `llama-3.3-70b-versatile` became
# Enterprise-only ("Contact Sales"), so a standard key 404s both. Moved to
# qwen/qwen3.6-27b: current, non-Enterprise, defined dev limits (250K TPM /
# 1K RPM), Chinese-strong, low enough politeness-RLHF to actually vent (the
# GPT-OSS alternatives would neuter it; no Llama is on the dev plan). Same
# model both locales for now. qwen3.8-27b is the newer Preview option (undefined
# limits) once validated. Smoke-verified through the live Worker after deploy;
# any Groq 404 still falls through to the OpenRouter fallback above.
GROQ_CHINESE_MODEL = "qwen/qwen3.6-27b"
GROQ_FALLBACK_MODEL = "qwen/qwen3.6-27b"

# Track M edge breakers (v1.3). Both default OFF (behavior unchanged).
# CLOUD_DISABLED="true" → 503 on every /v1/vent (global kill-switch).
# ROAST_MODE_ENABLED gates the sendable mode:"roast" cloud path; stays
# "false" until the Track M dam + zh-Hans sendable eval clear it.
CLOUD_DISABLED = "false"
ROAST_MODE_ENABLED = "false"

# SECURITY (P0): keep FALSE on the production Worker. A SANDBOX StoreKit purchase
# is free (TestFlight / a dev Apple ID), so accepting a sandbox receipt in prod
# would mint real Pro tokens for $0. Set "true" ONLY on a separate dev/test
# Worker to accept sandbox transactions for TestFlight testing.
ALLOW_SANDBOX_RECEIPTS = "false"

# Refund/revocation hardening (src/appstore_status.js). When "true", /v1/auth also
# checks the App Store Server API for the sub's CURRENT status (rejects a refunded
# / revoked sub the offline JWS can't see). FAIL-OPEN: if it can't run, the JWS
# decision stands. To ENABLE: (a) decide the key scope — a DEDICATED In-App-Purchase
# key (least privilege) is preferred over the broad Admin key DMMFP6XTXX on edge
# infra; (b) `wrangler secret put ASC_SIGNING_KEY` (the .p8 PEM); (c) set
# ASC_KEY_ID + ASC_ISSUER_ID (identifiers, not secret); (d) flip this to "true".
ASS_API_ENABLED = "false"

# --- DESIGN NOTE: these caps are COST controls, not a security boundary ---
# The counters below are best-effort daily budget guards backed by KV. They are
# NOT transactional and must not be treated as an authorization mechanism or a
# hard spend ceiling. The real backstops are the edge kill-switch
# (CLOUD_DISABLED) and provider-side spend limits configured at Groq /
# OpenRouter — set those, and keep them set.
# Accuracy limits, the measured behaviour under concurrency, and the atomic
# substrate options are tracked internally (v1.4 decision D2); this is a public
# repo, so the analysis lives in the private notes rather than here.

# Per-device rate limit (LEGACY / free lane — no session token). Counted against
# (deviceId, YYYY-MM-DD) in KV. Tune as cost / abuse picture evolves. M.2 will
# tighten this for pure-cloud free users.
DAILY_LIMIT_PER_DEVICE = "30"

# PRO lane daily cap (Track M M.1 v2): requests with a valid /v1/auth session
# token are counted against (account-sub, YYYY-MM-DD), so one Pro subscription
# shares one bucket across the user's devices.
PRO_DAILY_LIMIT = "200"

# PER-IP daily ATTEMPT cap (Track M M.2): pre-charged (non-refundable) on every
# request as a coarse abuse backstop over the rotatable deviceId + a retry-flood
# bound. Two tiers by request Origin:
# - WEB demo (jasonyeyuhe.github.io): strict — abuse-prone, browsers rarely share
#   an IP the way mobile does.
# - Native APP: GENEROUS — carrier-grade NAT (CGNAT) puts many legit mobile users
#   behind one IP, so this must not block them; it only bounds a single home-IP
#   abuser (~$1/day at 200). Tune up if legit CGNAT users hit `ip_rate_limited`.
WEB_DAILY_LIMIT_PER_IP = "8"
APP_DAILY_LIMIT_PER_IP = "200"

# OpenRouter referrer + product name so OpenRouter's dashboard shows
# attribution. Not secret; safe in vars.
OPENROUTER_REFERER = "https://github.com/JasonYeYuhe/RoastMate-iOS"
OPENROUTER_TITLE = "RoastMate"

# --- Atomic quota counter (v1.4, decision D2) ---
# QUOTA_BACKEND selects the substrate for every daily counter:
#   "kv" = the legacy get-then-put counter. NOT atomic: a same-key concurrent
#          burst has every request read the same pre-increment value. Measured
#          2026-09-02 — 55 concurrent on one deviceId gave 52 successes against
#          a cap of 30, all reporting remaining=29.
#          (evals/runs/2026-09-02-d2-kv-quota-race.md)
#   "do"  = the QuotaCounter Durable Object. One instance per counter key, and
#          a DO serialises requests to an instance, so check-and-increment is
#          genuinely atomic.
# Flip back to "kv" and redeploy to roll back instantly; the DO path already
# falls back to KV on its own if a call fails, so a DO outage degrades rather
# than 500s.
QUOTA_BACKEND = "do"

[[durable_objects.bindings]]
name = "QUOTA"
class_name = "QuotaCounter"

# SQLite storage backend — the one available on the Workers FREE plan
# (100k requests/day, 100k row writes/day), far above current volume. The
# key-value DO backend is paid-plans-only.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["QuotaCounter"]

# KV namespace for per-device rate-limit counters. Replace the `id` after
# `npx wrangler kv:namespace create rate_limits` (see README).
[[kv_namespaces]]
binding = "RATE_LIMITS"
id = "9883573e953e4a01a3bb22f86016438a"

# Secrets (run `npx wrangler secret put <NAME>`):
# - OPENROUTER_API_KEY: from https://openrouter.ai/settings/keys (required)
# - GROQ_API_KEY: from https://console.groq.com/keys (optional fallback)
