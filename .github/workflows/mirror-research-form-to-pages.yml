# Mirror research/web/*.{html,css,js} to the GitHub Pages repo
# (JasonYeYuhe/RoastMate) whenever the source-of-truth files change.
#
# Why: research/web/ in THIS repo (RoastMate-iOS) is the source of truth.
# The Pages repo just serves the static files at
# https://jasonyeyuhe.github.io/RoastMate/research.html. Without this
# Action, the two diverge — exact scenario Codex flagged in the
# 2026-05-28 audit.
#
# Auth: a single-purpose SSH Deploy Key on JasonYeYuhe/RoastMate (write
# scope, repo-scoped — safer than a broad classic PAT). One-time setup
# was done 2026-05-28 via the gh CLI:
#   - keypair generated, public added as Deploy Key on the Pages repo
#   - private key set as Actions secret PAGES_DEPLOY_SSH_KEY on
#     RoastMate-iOS
#   - both /tmp copies of the private key shredded
# To rotate: delete the Deploy Key on the Pages repo, re-run the setup.

name: Mirror research form to Pages

on:
  push:
    branches: [v1.1, main]
    paths:
      - "research/web/**"
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RoastMate-iOS (source of truth)
        uses: actions/checkout@v4
        with:
          path: ios-repo

      - name: Checkout JasonYeYuhe/RoastMate (Pages destination)
        uses: actions/checkout@v4
        with:
          repository: JasonYeYuhe/RoastMate
          path: pages-repo
          ssh-key: ${{ secrets.PAGES_DEPLOY_SSH_KEY }}

      - name: Copy research form files
        run: |
          cp ios-repo/research/web/research.html pages-repo/research.html
          cp ios-repo/research/web/research.css  pages-repo/research.css
          cp ios-repo/research/web/research.js   pages-repo/research.js
          # Step-2 booking page (anonymous-first refactor).
          if [ -f ios-repo/research/web/research-book.html ]; then
            cp ios-repo/research/web/research-book.html  pages-repo/research-book.html
          fi
          if [ -f ios-repo/research/web/research-book.js ]; then
            cp ios-repo/research/web/research-book.js  pages-repo/research-book.js
          fi

      - name: Detect changes
        id: changes
        working-directory: pages-repo
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        working-directory: pages-repo
        run: |
          git config user.email "yyyyy.yeyuhe@gmail.com"
          git config user.name "JasonYeYuhe"
          git add research.html research.css research.js \
                  $([ -f research-book.html ] && echo research-book.html) \
                  $([ -f research-book.js ] && echo research-book.js)
          UPSTREAM_SHA="${{ github.sha }}"
          UPSTREAM_REPO="${{ github.repository }}"
          git commit -m "Mirror research form from $UPSTREAM_REPO@${UPSTREAM_SHA:0:8}

          Auto-sync from research/web/ in the iOS app repo. Do not edit
          these files here directly — edit upstream and let the workflow
          mirror them. Source of truth: $UPSTREAM_REPO

          Co-Authored-By: Claude Opus 4.7 (1M context) <noreply@anthropic.com>"
          git push origin main
